services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beacon-station-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./beacon.db
      - ENVIRONMENT=development
      - DEBUG=true
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/beacon-station
      - OIDC_CLIENT_ID=beacon-station
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_AUDIENCE=beacon-station
      - OIDC_JWKS_URL=http://keycloak:8080/realms/beacon-station/protocol/openid-connect/certs
      - DEMO_MODE=true
      - PLANS_ROOT=/app/data/plans
      - CORS_ORIGINS=http://localhost:5173,http://frontend:5173
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - beacon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beacon-station-frontend
    environment:
      - VITE_API_BASE=/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - beacon-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: beacon-station-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - beacon-network

volumes:
  backend-data:
  keycloak-data:

networks:
  beacon-network:
    driver: bridge