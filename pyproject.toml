[project]
name = "beacon-station-ryan-vo"
version = "1.0.0"
description = "Agentic skills framework & software development methodology for token-efficient LLM agent workflows"
authors = [{ name = "Ryan Vo", email = "ryandtvo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/A220man/beacon-station-ryan-vo"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.uvicorn]
host = "127.0.0.1"
port = 8000